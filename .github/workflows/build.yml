# Simple workflow for deploying static content to GitHub Pages
name: Create a release build for all pushes to main

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "build_linux"
  cancel-in-progress: true


jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install audio dependencies
        run: sudo apt-get install -y libasound2-dev
      - name: Install GUI dependencies
        run: sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev
      - name: Run cargo check
        run: cargo check --workspace --all-targets --message-format short
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: Run cargo test
        run: cargo test --workspace --all-features -- --test-threads=1
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          release_name: Release ${{ github.ref }}
          files: |
            target/release/pulseforge.exe
            target/release/pulseforge
          files: |
            target/release/pulseforge.exe
            target/release/pulseforge
          body: Release
          draft: false
          prerelease: true
          tag_name: ${{ github.ref }}