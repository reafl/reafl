[package]
name = "reafl-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The reafl editor: state, windows and panels"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
midir = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reafl-core = { path = "../reafl-core" }
reafl-plugins = { path = "../reafl-plugins" }
reafl-hosting = { path = "../reafl-hosting" }
reafl-profiling = { path = "../reafl-profiling" }
reafl-settings = { path = "../reafl-settings" }
reafl-tasks = { path = "../reafl-tasks" }
reafl-widgets = { path = "../reafl-widgets" }
vst3-host = { version = "0.10", default-features = false, features = ["process-isolation"] }
clack-host = "0.2"
clack-extensions = "0.2"
raw-window-handle = "0.6"
