[package]
name = "pulseforge-profiling"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-editor profiling, flame graphs and plug-in debugging for PulseForge"

[features]
default = ["ui", "system", "gpu"]
# The egui debug panel (flame graph, graphs, plug-in table).
ui = ["dep:egui", "dep:egui_glow", "dep:glow"]
# The GPU histogram reduction (needs a GL 4.3 context, falls back to the CPU).
gpu = ["ui"]
# CPU and RAM sampling (one background thread).
system = ["dep:sysinfo"]

[dependencies]
# Lock-free multi-producer queue: the audio and UI threads push spans into it.
crossbeam-queue = "0.3"
egui = { version = "0.33", optional = true }
egui_glow = { version = "0.33", optional = true }
glow = { version = "0.16", optional = true }
sysinfo = { version = "0.40", optional = true }
