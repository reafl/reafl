[package]
name = "pulseforge-hosting"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "VST3 and CLAP plug-in hosting for PulseForge"

[dependencies]
vst3-host = { version = "0.10", default-features = false, features = ["process-isolation"] }
clack-host = "0.2"
clack-extensions = { version = "0.2", default-features = false, features = ["clack-host", "gui", "params", "state"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
