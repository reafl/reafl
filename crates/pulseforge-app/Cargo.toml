[package]
name = "pulseforge-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The PulseForge editor: state, windows and panels"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
midir = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
pulseforge-core = { path = "../pulseforge-core" }
pulseforge-plugins = { path = "../pulseforge-plugins" }
pulseforge-hosting = { path = "../pulseforge-hosting" }
pulseforge-profiling = { path = "../pulseforge-profiling" }
pulseforge-settings = { path = "../pulseforge-settings" }
pulseforge-tasks = { path = "../pulseforge-tasks" }
pulseforge-widgets = { path = "../pulseforge-widgets" }
vst3-host = { version = "0.10", default-features = false, features = ["process-isolation"] }
clack-host = "0.2"
clack-extensions = "0.2"
raw-window-handle = "0.6"
