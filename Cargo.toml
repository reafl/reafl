[package]
name = "reafl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-native pattern-based digital audio workstation"

[workspace]
members = [
    "crates/reafl-app",
    "crates/reafl-core",
    "crates/reafl-hosting",
    "crates/reafl-plugins",
    "crates/reafl-profiling",
    "crates/reafl-settings",
    "crates/reafl-tasks",
    "crates/reafl-widgets",
]
resolver = "3"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
reafl-app = { path = "crates/reafl-app" }
reafl-profiling = { path = "crates/reafl-profiling" }
