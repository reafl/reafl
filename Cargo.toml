[package]
name = "pulseforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-native pattern-based digital audio workstation"

[workspace]
members = [
    "crates/pulseforge-app",
    "crates/pulseforge-core",
    "crates/pulseforge-hosting",
    "crates/pulseforge-plugins",
    "crates/pulseforge-profiling",
    "crates/pulseforge-settings",
    "crates/pulseforge-tasks",
    "crates/pulseforge-widgets",
]
resolver = "3"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
pulseforge-app = { path = "crates/pulseforge-app" }
pulseforge-profiling = { path = "crates/pulseforge-profiling" }
